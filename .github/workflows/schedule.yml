name: Veek Scheduled Check-in

on:
  schedule:
    # Executa a cada 30 minutos (nos minutos :15 e :45 para evitar a fila de pico do GitHub no :00 e :30)
    - cron: '15,45 * * * *'
  workflow_dispatch: # Permite disparar manualmente pela aba Actions do GitHub

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Executar script de check-in
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS || secrets.accounts }}
        run: node index.js
