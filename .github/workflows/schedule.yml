name: Veek Scheduled Check-in

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Executar script de check-in
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS || secrets.accounts }}
        run: node index.js
